<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Safe migration flow</title><desc id="desc">Dokploy secrets move through plan review and an encrypted snapshot to Infisical, then Dokploy receives Vault references and both systems are verified.</desc>
  <defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111d2e"/><stop offset="1" stop-color="#16263a"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#52677f"/></marker></defs><rect width="1200" height="280" rx="24" fill="#0b1422"/>
  <g font-family="IBM Plex Sans,Segoe UI,sans-serif"><g transform="translate(48 70)"><rect width="220" height="132" rx="18" fill="url(#panel)" stroke="#38516d"/><circle cx="38" cy="40" r="17" fill="#22c55e" fill-opacity=".15"/><path d="M30 40h16M38 32v16" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/><text x="66" y="46" fill="#f8fafc" font-size="20" font-weight="700">Dokploy</text><text x="28" y="83" fill="#9fb0c4" font-size="15">Environment secrets</text><text x="28" y="108" fill="#67e8f9" font-family="JetBrains Mono,monospace" font-size="13">KEY=value</text></g><path d="M278 136h55" stroke="#52677f" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(344 46)"><rect width="300" height="180" rx="18" fill="url(#panel)" stroke="#22c55e" stroke-opacity=".65"/><text x="28" y="42" fill="#f8fafc" font-size="20" font-weight="700">Review before writing</text><g fill="#9fb0c4" font-size="15"><text x="28" y="78">1. Check connections</text><text x="28" y="105">2. Preview exact changes</text><text x="28" y="132">3. Create encrypted snapshot</text><text x="28" y="159">4. Confirm migration</text></g><circle cx="266" cy="37" r="14" fill="#22c55e"/><path d="M259 37l5 5 9-11" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M654 136h55" stroke="#52677f" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(720 70)"><rect width="220" height="132" rx="18" fill="url(#panel)" stroke="#38516d"/><circle cx="38" cy="40" r="17" fill="#67e8f9" fill-opacity=".12"/><path d="M31 40h14M34 34l-5 6 5 6M42 34l5 6-5 6" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="66" y="46" fill="#f8fafc" font-size="20" font-weight="700">Infisical</text><text x="28" y="83" fill="#9fb0c4" font-size="15">Organized secret paths</text><text x="28" y="108" fill="#67e8f9" font-family="JetBrains Mono,monospace" font-size="13">/project/service</text></g><path d="M950 136h42" stroke="#52677f" stroke-width="2" marker-end="url(#arrow)"/><g transform="translate(1003 70)"><rect width="149" height="132" rx="18" fill="url(#panel)" stroke="#38516d"/><circle cx="32" cy="39" r="15" fill="#22c55e" fill-opacity=".15"/><path d="M25 39l5 5 9-11" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="45" fill="#f8fafc" font-size="18" font-weight="700">Verified</text><text x="22" y="82" fill="#9fb0c4" font-size="14">Vault references</text><text x="22" y="106" fill="#9fb0c4" font-size="14">read back</text></g></g>
</svg>
