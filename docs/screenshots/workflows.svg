  <text x="20" y="153" class="row"> ● Dokploy v0.31.4 · https://dokploy.example.com                                                              </text>
  <text x="20" y="172" class="row">                                                                                                              </text>
  <text x="20" y="191" class="row"> ╭─ Choose workflow ────────────────────────────────────────────────────────────────────────────────────────╮ </text>
  <text x="20" y="210" class="row"> │                                                                                                          │ </text>
  <text x="20" y="229" class="row"> │  › Dokploy → Infisical                                                                                   │ </text>
  <text x="20" y="248" class="row"> │    Move raw values to /project/_shared and /project/service, then attach Vault refs                      │ </text>
  <text x="20" y="267" class="row"> │                                                                                                          │ </text>
  <text x="20" y="286" class="row"> │    Infisical → Dokploy                                                                                   │ </text>
  <text x="20" y="305" class="row"> │    Attach missing Vault refs from the existing folder hierarchy; no plaintext import                     │ </text>
  <text x="20" y="324" class="row"> │                                                                                                          │ </text>
  <text x="20" y="343" class="row"> │    Rollback                                                                                              │ </text>
